[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirect rules are generated into dist/_redirects by
# scripts/generate-redirects.mjs from docs/url-ledger.csv, so the ledger stays
# the single source of truth for every URL decision (M-REDIRECT-WIRED).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Scripts are all files on this origin (astro.config.mjs sets
    # assetsInlineLimit: 0), so script-src needs no 'unsafe-inline'. Styles do:
    # stylesheets are inlined into each page, the RAL swatches carry their
    # colour as a style attribute, and the colour wheel builds its own styles.
    # Fonts are self-hosted (astro.config.mjs). YouTube is framed only on /videos-de-demostracion/, after a click.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# The e-book sits behind an email form; keep the PDF itself out of search
# results so it is not found without it.
[[headers]]
  for = "/descargas/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Fingerprinted build output is safe to cache forever; the uploads directory
# keeps the WordPress filenames, so it is cached for a day instead.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
